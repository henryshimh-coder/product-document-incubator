[project]
name = "product-intelligence"
version = "0.1.0"
description = "产品智策轻量交付版"
requires-python = ">=3.11,<3.13"
dependencies = [
  "streamlit>=1.60,<1.61",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "tenacity>=9,<10",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "PyYAML>=6,<7",
  "filelock>=3.16,<4",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
